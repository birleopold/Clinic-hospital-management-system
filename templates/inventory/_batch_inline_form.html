<tr class="inline-form">
  <td colspan="6">
    <div class="card" style="margin:8px 0;">
      <form method="post" action="" hx-post="{% url 'inventory-batch-create' item.id %}" data-success-message="Batch added">
        {% csrf_token %}
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; align-items:end;">
          <div>
            <label>Batch #</label><br/>
            <input type="text" name="batch_no" placeholder="e.g. B12345" />
          </div>
          <div>
            <label>Expiry</label><br/>
            <input type="date" name="expiry" />
          </div>
          <div>
            <label>Quantity</label><br/>
            <input type="number" step="0.01" name="quantity" value="0" />
          </div>
          <div style="grid-column:1/-1; display:flex; gap:8px;">
            <button class="btn" type="submit">Save</button>
            <button type="button" class="btn btn-secondary" onclick="this.closest('tr').remove()">Cancel</button>
          </div>
        </div>
      </form>
    </div>
  </td>
</tr>
