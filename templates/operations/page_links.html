<nav class="pagination" aria-label="Record pages">{% if page.has_previous %}<a href="?status={{ status|urlencode }}&mine={% if mine %}1{% endif %}&page={{ page.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?status={{ status|urlencode }}&mine={% if mine %}1{% endif %}&page={{ page.next_page_number }}">Next</a>{% endif %}</nav>
