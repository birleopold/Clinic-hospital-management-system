<section class="patient-banner" aria-label="Patient identity"><div><div class="eyebrow">Patient record</div><h1>{{ patient }}</h1><p class="patient-identifiers">MRN {{ patient.medical_record_id }} · Born {{ patient.date_of_birth|date:'d M Y'|default:'Not recorded' }}</p><span class="badge">Allergies: {{ patient.get_allergy_status_display }}</span></div><div class="actions"><a class="btn btn-secondary" href="{% url 'suite-card' patient.pk %}">Identity card</a>{% for visit in active_visits %}<a class="btn" href="{% url 'ehr-encounter-detail' visit.pk %}">Resume visit #{{ visit.pk }}</a>{% endfor %}</div></section>
