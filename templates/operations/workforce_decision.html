<form method="post" action="{% url 'suite-workforce-action' kind record.pk %}">{% csrf_token %}<label for="{{ kind }}-reason-{{ record.pk }}">Review reason</label><input id="{{ kind }}-reason-{{ record.pk }}" name="reason" required maxlength="250"><button name="decision" value="approved" type="submit">Approve</button><button name="decision" value="rejected" type="submit">Reject</button></form>
