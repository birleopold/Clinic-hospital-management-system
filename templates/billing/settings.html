{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<a href="/" class="muted">← Back</a>
<div class="card">
  <h2 style="margin:0 0 12px;">Clinic Settings</h2>
  <form method="post" action="" hx-post="{% url 'billing-settings' %}" data-success-message="Settings saved" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:12px; align-items:end;">
    {% csrf_token %}
    <div>
      <label>Near-expiry threshold (days)</label><br/>
      <input type="number" min="1" max="3650" name="near_expiry_days" value="{{ config.near_expiry_days|default:30 }}" />
      <div class="muted">Used to highlight batches approaching expiry in Pharmacy.</div>
    </div>
    <div style="grid-column:1/-1; display:flex; gap:8px;">
      <button class="btn" type="submit">Save</button>
      <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
