name: Django checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms-test-only
          POSTGRES_DB: hms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hms -d hms" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - run: python -m pip check
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://hms:hms-test-only@localhost:5432/hms' || '' }}
        run: python -m pytest -q
      - name: Verify clean installation
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput

      - name: PostgreSQL restore drill
        if: matrix.database == 'postgres'
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          TEST_DATABASE_URL: postgres://hms:hms-test-only@localhost:5432/hms
        run: |
          python manage.py migrate --noinput
          python scripts/postgres_restore_drill.py
