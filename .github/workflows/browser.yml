name: Disposable browser review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    # Use a standard VM and the runner's existing sandbox support. Never alter
    # user namespaces, AppArmor, browser flags, certificates, or system security.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and pinned browser tooling
        run: |
          python -m pip install -r requirements-core.txt
          python -m pip check
          npm --prefix scripts/browser-ci install --ignore-scripts --no-audit --no-fund
          scripts/browser-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Static harness checks
        run: |
          python -m unittest discover -s scripts/browser-ci -p 'test_*.py'
          python -m py_compile scripts/browser_ci_review.py
          node --check scripts/browser_ci_review.cjs
          node --check scripts/shell_layout_browser.cjs
      - name: Review synthetic owner and clinic browser flows
        run: python scripts/browser_ci_review.py
      # Deliberately no artifact upload: MFA enrollment, cookies and protected
      # bundles are transient secrets even when the accounts are synthetic.
